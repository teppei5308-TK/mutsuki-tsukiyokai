<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月夜会 ポイント管理</title>

<style>
:root{
  --navy:#0f1829; --navy2:#1a2744; --navy3:#243352;
  --gold:#c9a961; --gold-l:#e0c88a;
  --ivory:#f5f2ea; --dim:#8b93a5; --line:#2c3650;
  --ok:#5bbd8a; --err:#e0654a;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
  --sans:"Hiragino Sans","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
  --num:"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--ivory);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin-inline:auto;padding:0 1rem 4rem}

header{text-align:center;padding:1.6rem 1rem 1rem;border-bottom:1px solid var(--line)}
header .mark{font-family:var(--mincho);font-size:1.2rem;letter-spacing:.3em;color:var(--gold-l);margin:0}
header .sub{font-size:.68rem;letter-spacing:.2em;color:var(--dim);margin:.2rem 0 0}

.state{display:none} .state.on{display:block}

/* PIN */
.pin-wrap{text-align:center;padding:3rem 1rem}
.pin-wrap p{color:var(--dim);font-size:.88rem;margin-bottom:1.4rem}
input[type=tel],input[type=text],input[type=number],select,textarea{
  width:100%;padding:.85rem .9rem;font-size:16px;background:var(--navy2);
  border:1px solid var(--line);color:var(--ivory);font-family:var(--sans);border-radius:2px;
}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.pin-wrap input{text-align:center;letter-spacing:.5em;font-size:1.3rem}
button{
  width:100%;padding:.95rem;font-size:.95rem;font-weight:700;letter-spacing:.12em;
  background:var(--gold);color:var(--navy);border:none;cursor:pointer;
  font-family:var(--sans);border-radius:2px;margin-top:.8rem;
}
button:disabled{opacity:.45}
button.sub{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400}

/* 検索 */
.search{padding:1rem 0 .6rem;position:sticky;top:0;background:var(--navy);z-index:5}
.tabs{display:flex;gap:.4rem;margin-bottom:.8rem}
.tabs button{flex:1;margin:0;padding:.6rem;font-size:.82rem;background:var(--navy2);color:var(--dim);border:1px solid var(--line);font-weight:600}
.tabs button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* 会員リスト */
.mlist{display:grid;gap:.4rem}
.m{
  background:var(--navy2);border:1px solid var(--line);padding:.75rem .9rem;
  display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;cursor:pointer;
}
.m:active{border-color:var(--gold)}
.m .nm{font-weight:600;font-size:.95rem}
.m .sh{color:var(--dim);font-size:.76rem}
.m .pt{font-family:var(--num);font-size:1.15rem;color:var(--gold-l);font-weight:700;white-space:nowrap}
.m .pt small{font-size:.62rem;color:var(--dim);font-weight:400;margin-left:.15rem}
.m.unlinked{opacity:.55}
.m.unlinked .nm::after{content:"未登録";font-size:.62rem;background:var(--line);color:var(--dim);padding:.05rem .4rem;margin-left:.4rem;font-weight:400}
.empty{text-align:center;color:var(--dim);font-size:.85rem;padding:2rem 1rem}

/* 付与画面 */
.card{background:var(--navy2);border:1px solid var(--gold);padding:1.1rem;margin:1rem 0}
.card .who{font-size:1.05rem;font-weight:600;margin:0}
.card .who small{display:block;color:var(--dim);font-size:.78rem;font-weight:400;margin-top:.15rem}
.card .now{font-family:var(--num);font-size:1.5rem;color:var(--gold-l);font-weight:700;margin-top:.5rem}
.card .now small{font-size:.68rem;color:var(--dim);font-weight:400}

label{display:block;font-size:.8rem;color:var(--gold-l);margin:1.1rem 0 .35rem;letter-spacing:.04em}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.5rem}
.quick button{margin:0;padding:.7rem .2rem;font-size:.9rem;background:var(--navy3);color:var(--ivory);border:1px solid var(--line);font-weight:600}
.quick button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.reasons{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem;margin-top:.5rem}
.reasons button{margin:0;padding:.6rem .3rem;font-size:.82rem;background:var(--navy3);color:var(--ivory);border:1px solid var(--line);font-weight:400}
.reasons button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}

.msg{padding:.8rem 1rem;font-size:.86rem;margin:1rem 0;display:none}
.msg.on{display:block}
.msg.ok{background:rgba(91,189,138,.12);border-left:3px solid var(--ok);color:var(--ok)}
.msg.err{background:rgba(224,101,74,.12);border-left:3px solid var(--err);color:var(--err)}

/* 履歴 */
.hist{display:grid;gap:.3rem;margin-top:.6rem}
.h{background:var(--navy2);border:1px solid var(--line);padding:.55rem .8rem;display:grid;grid-template-columns:1fr auto;gap:.5rem;font-size:.8rem}
.h .d{color:var(--dim);font-size:.7rem}
.h .a{font-family:var(--num);font-weight:700;white-space:nowrap}
.h .a.plus{color:var(--ok)} .h .a.minus{color:var(--err)}

.spinner{width:30px;height:30px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:2rem auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}

  .castnote{font-size:.8rem;color:var(--dim);line-height:1.8;margin:4px 0 12px}
  .castnote b{color:var(--gold)}
  #castText{
    width:100%;background:var(--card);border:1px solid var(--line);border-radius:4px;
    color:var(--txt);font-family:inherit;font-size:.95rem;line-height:1.7;
    padding:14px;resize:vertical;
  }
  #castText:focus{outline:none;border-color:var(--gold)}
  .castbtn{
    display:block;width:100%;margin-top:12px;padding:17px;
    background:var(--gold);border:none;border-radius:4px;
    color:#101a2c;font-size:1rem;font-weight:700;letter-spacing:.1em;
    font-family:inherit;cursor:pointer;
  }
  .castbtn:disabled{opacity:.5}
  #castMsg{margin-top:12px;font-size:.85rem;line-height:1.7}
  #castMsg.ok{color:#7fd6a2;border-left:3px solid #7fd6a2;padding-left:10px}
  #castMsg.ng{color:#e0897a;border-left:3px solid #e0897a;padding-left:10px}
</style>

<header>
  <p class="mark">夢　月</p>
  <p class="sub">POINT ADMIN</p>
</header>

<div class="wrap">

<!-- PIN入力 -->
<div class="state on" id="s-pin">
  <div class="pin-wrap">
    <p>暗証番号を入力してください</p>
    <input type="tel" id="pin" inputmode="numeric" maxlength="8" placeholder="････">
    <div class="msg err" id="pinErr">暗証番号が違います</div>
    <button id="btnPin">開　く</button>
  </div>
</div>

<!-- 会員一覧 -->
<div class="state" id="s-list">
  <div class="search">
    <div class="tabs">
      <button class="on" data-t="members">会員から選ぶ</button>
      <button data-t="history">最近の履歴</button>
      <button data-t="cast">配信</button>
    </div>
    <input type="text" id="q" placeholder="お名前・お店で絞り込み" autocomplete="off">
  </div>
  <div id="listArea"><div class="spinner"></div></div>
  <div id="histArea" style="display:none"><div class="spinner"></div></div>
  <div id="castArea" style="display:none">
    <p class="castnote">登録済みの月夜会メンバー <b id="castCount">—</b> 名に送信します。<br>
    友だち追加していない方には届きません。1名につき配信数1通を消費します。</p>
    <textarea id="castText" rows="9" placeholder="送信する本文を入力&#10;（1000文字まで）"></textarea>
    <button type="button" id="castBtn" class="castbtn">この内容で送信する</button>
    <div id="castMsg"></div>
  </div>
</div>

<!-- 付与 -->
<div class="state" id="s-give">
  <button class="sub" id="btnBack" style="margin:1rem 0 0">← 一覧にもどる</button>
  <div class="card">
    <p class="who" id="g-name">—<small id="g-shop">—</small></p>
    <p class="now" id="g-pt">0 <small>P</small></p>
  </div>

  <label>付与するポイント</label>
  <div class="quick" id="quick">
    <button data-v="1">+1</button><button data-v="2">+2</button>
    <button data-v="3">+3</button><button data-v="4">+4</button>
    <button data-v="6">+6</button><button data-v="10">+10</button>
    <button data-v="-1">−1</button><button data-v="0">その他</button>
  </div>
  <input type="number" id="amount" placeholder="数値を入力" style="margin-top:.5rem;display:none">

  <label>理由</label>
  <div class="reasons" id="reasons">
    <button data-v="同伴来店">同伴来店</button>
    <button data-v="ご来店">ご来店</button>
    <button data-v="ご紹介">ご紹介</button>
    <button data-v="付与漏れ分">付与漏れ分</button>
    <button data-v="特典利用">特典利用（減算）</button>
    <button data-v="">その他（入力）</button>
  </div>
  <input type="text" id="reason" placeholder="理由を入力" style="margin-top:.5rem;display:none">

  <div class="msg" id="giveMsg"></div>
  <button id="btnGive">ポイントを付与する</button>
  <p style="color:var(--dim);font-size:.74rem;text-align:center;margin-top:.8rem">
    付与すると、ご本人のLINEに自動で通知が届きます
  </p>
</div>

</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbz7fer7Jsfp1VRb_bhaUJsP7PC3D2nZHJ0KYgJLUNPs_i69oWL9mROMNVQ2IagQ01HhyQ/exec";

const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.state').forEach(e=>e.classList.remove('on')); $(id).classList.add('on'); };
let PIN = localStorage.getItem('tsukiyokai_pin') || '';
let members = [], target = null, amount = null, reason = null;

/* ---- PIN ---- */
$('btnPin').onclick = () => tryPin($('pin').value.trim());
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnPin').click(); });

async function tryPin(pin) {
  if (!pin) return;
  $('btnPin').disabled = true;
  const r = await api(`admin_members&pin=${encodeURIComponent(pin)}`);
  $('btnPin').disabled = false;
  if (!r.ok) { $('pinErr').classList.add('on'); return; }
  PIN = pin; localStorage.setItem('tsukiyokai_pin', pin);
  members = r.members; renderList(); show('s-list');
}

if (PIN) tryPin(PIN);   // 前回入力済みなら自動で開く

/* ---- 一覧 ---- */
function renderList() {
  const q = $('q').value.trim().toLowerCase();
  const hit = members.filter(m =>
    !q || (m.name||'').toLowerCase().includes(q) || (m.shop||'').toLowerCase().includes(q));
  if (!hit.length) { $('listArea').innerHTML = '<div class="empty">該当する会員がいません</div>'; return; }
  $('listArea').innerHTML = '<div class="mlist">' + hit.map((m,i) =>
    `<div class="m${m.linked ? '' : ' unlinked'}" data-i="${members.indexOf(m)}">
       <div><div class="nm">${esc(m.name)}</div><div class="sh">${esc(m.shop)}　${esc(m.id)}${m.expiry ? `　期限 ${esc(m.expiry)}` : ''}</div></div>
       <div class="pt">${m.points}<small>P</small></div>
     </div>`).join('') + '</div>';
  document.querySelectorAll('.m').forEach(el => {
    el.onclick = () => openGive(members[Number(el.dataset.i)]);
  });
}
$('q').addEventListener('input', renderList);

document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = async () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    const t = b.dataset.t;
    const isHist = t === 'history';
    const isCast = t === 'cast';
    $('listArea').style.display = (isHist || isCast) ? 'none' : 'block';
    $('histArea').style.display = isHist ? 'block' : 'none';
    $('castArea').style.display = isCast ? 'block' : 'none';
    $('q').style.display = (isHist || isCast) ? 'none' : 'block';
    if (isCast) { $('castCount').textContent = members.filter(m => m.linked).length; return; }
    if (isHist) {
      $('histArea').innerHTML = '<div class="spinner"></div>';
      const r = await api(`admin_history&pin=${encodeURIComponent(PIN)}`);
      if (!r.ok) { $('histArea').innerHTML = '<div class="empty">読み込めませんでした</div>'; return; }
      if (!r.history.length) { $('histArea').innerHTML = '<div class="empty">まだ履歴がありません</div>'; return; }
      $('histArea').innerHTML = '<div class="hist">' + r.history.map(h =>
        `<div class="h">
           <div><div>${esc(h.name)}　<span style="color:var(--dim)">${esc(h.reason)}</span></div>
                <div class="d">${esc(h.date)}　残高 ${h.total}P</div></div>
           <div class="a ${h.amount >= 0 ? 'plus' : 'minus'}">${h.amount >= 0 ? '+' : ''}${h.amount}P</div>
         </div>`).join('') + '</div>';
    }
  };
});

/* ---- 付与 ---- */
function openGive(m) {
  target = m; amount = null; reason = null;
  $('g-name').firstChild.textContent = m.name;
  $('g-shop').textContent = `${m.shop}　${m.id}` + (m.expiry ? `　／　有効期限 ${m.expiry}` : '');
  $('g-pt').innerHTML = `${m.points} <small>P</small>`;
  document.querySelectorAll('#quick button,#reasons button').forEach(b => b.classList.remove('on'));
  $('amount').style.display = 'none'; $('amount').value = '';
  $('reason').style.display = 'none'; $('reason').value = '';
  $('giveMsg').className = 'msg';
  show('s-give'); window.scrollTo(0,0);
}
$('btnBack').onclick = () => { show('s-list'); renderList(); };

document.querySelectorAll('#quick button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#quick button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    const v = Number(b.dataset.v);
    if (v === 0) { $('amount').style.display = 'block'; amount = null; $('amount').focus(); }
    else { $('amount').style.display = 'none'; amount = v; }
  };
});
document.querySelectorAll('#reasons button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#reasons button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    const v = b.dataset.v;
    if (!v) { $('reason').style.display = 'block'; reason = null; $('reason').focus(); }
    else { $('reason').style.display = 'none'; reason = v; }
  };
});

$('btnGive').onclick = async () => {
  const amt = amount !== null ? amount : Number($('amount').value);
  const rsn = reason !== null ? reason : $('reason').value.trim();
  if (!amt) { msg('err', 'ポイント数を選んでください'); return; }
  if (!rsn) { msg('err', '理由を選んでください'); return; }

  $('btnGive').disabled = true; msg('', '');
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'admin_point', pin:PIN, memberId:target.id, amount:amt, reason:rsn })
    });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || '失敗しました');
    target.points = d.points;
    $('g-pt').innerHTML = `${d.points} <small>P</small>`;
    msg('ok', `${d.name} 様に ${amt > 0 ? '+' : ''}${amt}P を付与しました（残高 ${d.points}P）`);
    document.querySelectorAll('#quick button,#reasons button').forEach(b => b.classList.remove('on'));
    amount = null; reason = null;
    $('amount').value = ''; $('reason').value = '';
  } catch (e) {
    msg('err', '付与できませんでした。通信環境をご確認ください');
  }
  $('btnGive').disabled = false;
};

function msg(type, text) {
  const el = $('giveMsg');
  el.className = 'msg' + (type ? ` ${type} on` : '');
  el.textContent = text;
}
$('castBtn').onclick = async () => {
  const text = $('castText').value.trim();
  const n = members.filter(m => m.linked).length;
  const msg = $('castMsg');
  msg.className = ''; msg.textContent = '';
  if (!text) { msg.className = 'ng'; msg.textContent = '本文を入力してください。'; return; }
  if (!confirm(`${n}名のメンバーに送信します。よろしいですか？\n\n※取り消しはできません`)) return;
  $('castBtn').disabled = true;
  $('castBtn').textContent = '送信中…';
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'admin_broadcast', pin:PIN, text:text })
    });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || '失敗しました');
    msg.className = 'ok';
    msg.textContent = `${d.sent}名に送信しました。`;
    $('castText').value = '';
  } catch (e) {
    msg.className = 'ng';
    msg.textContent = '送信できませんでした：' + e.message;
  }
  $('castBtn').disabled = false;
  $('castBtn').textContent = 'この内容で送信する';
};

async function api(q) {
  try { const r = await fetch(`${GAS_URL}?action=${q}`); return await r.json(); }
  catch (e) { return { ok:false, error:'通信エラー' }; }
}
function esc(s) { return String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
